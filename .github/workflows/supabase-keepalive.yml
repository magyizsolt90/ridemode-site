name: Supabase keep-alive

on:
  schedule:
    # Free-tier Supabase projects pause after 7 days with zero DB activity —
    # this pings weekly so it never gets the chance to.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "https://nomxxaworqxcchfbmfof.supabase.co/rest/v1/feedback?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
